name: Sync Community Skills

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BackendGuard
        uses: actions/checkout@v4
        with:
          path: contextOS

      - name: Checkout BackendGuard skills
        uses: actions/checkout@v4
        with:
          repository: vantinn/backendguard-skills
          path: contextOS-skills

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync skills
        run: node scripts/sync-community-skills.mjs ../contextOS-skills community-skills
        working-directory: contextOS

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          path: contextOS
          commit-message: Sync community skills
          title: Sync community skills
          body: |
            Automated sync from `vantinn/backendguard-skills`.

            This PR updates `community-skills/` in the main BackendGuard package.
          branch: sync/community-skills
          delete-branch: true
