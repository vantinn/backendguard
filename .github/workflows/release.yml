name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate plugin
        run: npm run validate:plugin

      - name: Unit tests
        run: npm test

      - name: Warm local embedding model
        run: node cli/backendguard.js embeddings warm -- "review authentication and database access for this backend service"

      - name: MCP protocol and performance smoke
        run: npm run test:mcp

      - name: Detection quality
        run: npm run evaluate:detection

      - name: Package lifecycle (pack, clean install, run)
        run: npm run test:package

      - name: Release readiness gates
        run: npm run evaluate

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
